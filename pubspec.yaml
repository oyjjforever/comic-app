name: comic_reader
description: "A comic reader app that connects to Electron server via LAN."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  multicast_dns: ^0.3.2
  network_info_plus: ^5.0.0
  permission_handler: ^11.3.0
  cached_network_image: ^3.3.0
  photo_view: ^0.15.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon.png"
  windows:
    generate: true
    image_path: "assets/icons/icon.png"
  macos:
    generate: true
    image_path: "assets/icons/icon.png"
  linux:
    generate: true
    image_path: "assets/icons/icon.png"
  web:
    generate: true
    image_path: "assets/icons/icon.png"

flutter:
  uses-material-design: true
