name: comic_reader
description: "A comic reader app that connects to Electron server via LAN."
publish_to: "none"
version: 1.1.0

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  multicast_dns: ^0.3.2
  network_info_plus: ^5.0.0
  permission_handler: ^11.3.0
  cached_network_image: ^3.3.0
  photo_view: ^0.15.0
  path_provider: ^2.1.0
  shared_preferences: ^2.2.0
  provider: ^6.1.0
  package_info_plus: ^8.0.0
  dio: ^5.4.0
  open_filex: ^4.5.0
  url_launcher: ^6.2.0
  # 视频播放
  media_kit: ^1.1.0
  media_kit_video: ^1.2.0
  media_kit_libs_video: ^1.0.0
  # 屏幕常亮
  wakelock_plus: ^1.2.0
  # 图片处理（缩略图压缩）
  image: ^4.0.0
  # 视频封面磁盘缓存所需哈希
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icons/icon.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/icon.png"
  windows:
    generate: true
    image_path: "assets/icons/icon.png"
  macos:
    generate: true
    image_path: "assets/icons/icon.png"
  linux:
    generate: true
    image_path: "assets/icons/icon.png"
  web:
    generate: true
    image_path: "assets/icons/icon.png"

flutter:
  uses-material-design: true
